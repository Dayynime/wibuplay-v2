name: Release Google Play (AAB)

# Build khusus Google Play: --dart-define=PLAY_BUILD=true, format AAB,
# ditandatangani UPLOAD KEY (bukan debug key), tanpa izin
# REQUEST_INSTALL_PACKAGES dan tanpa <queries> LAUNCHER.
#
# Secret yang dibutuhkan (Settings > Secrets and variables > Actions):
#   UPLOAD_KEYSTORE_BASE64   keystore upload (base64), BUKAN debug.keystore
#   UPLOAD_STORE_PASSWORD
#   UPLOAD_KEY_PASSWORD
#   UPLOAD_KEY_ALIAS         opsional, default "upload"
#   PLAY_SIG_SHA256          opsional: SHA-256 "Kunci penandatanganan aplikasi"
#                            dari Play Console > Uji dan rilis > Integritas aplikasi.
#                            Kosong = cek tanda tangan IntegrityGuard dimatikan.
#   FIREBASE_API_KEY, FIREBASE_APP_ID  (sama dengan release.yml)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versi (format x.y atau x.y.z, contoh 2.8)'
        required: true
        default: '2.8.4'

permissions:
  contents: read

env:
  APP_NAME: Zenime

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tentukan versi
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          V="$INPUT_VERSION"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versi '$V' tidak valid. Pakai format x.y atau x.y.z (contoh 2.8)"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA:-0}
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versi $V (versionCode $CODE)"

      - name: Siapkan upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KS=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android (kalau belum ada)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.dayynime --project-name wibuplay
          fi

      - name: Atur applicationId (ikut Zenime)
        run: |
          python3 - <<'PY'
          import glob, re, sys
          files = glob.glob('android/app/build.gradle*')
          if not files:
              print('::error::android/app/build.gradle(.kts) tidak ditemukan')
              sys.exit(1)
          p = files[0]
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'applicationId\s*=?\s*["\'][^"\']*["\']', 'applicationId = "com.aistudio.zenime.app"', s, count=1)
          if n != 1:
              print('::error::applicationId tidak ditemukan di ' + p)
              sys.exit(1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "applicationId\|namespace\|targetSdk\|minSdk" android/app/build.gradle*

      # Versi Play: tanpa REQUEST_INSTALL_PACKAGES (dibuang juga kalau ada plugin
      # yang menambahkannya) dan tanpa <queries> LAUNCHER.
      - name: Atur AndroidManifest (versi Play)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <application', 1)
          s = re.sub(r'\s*<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\s*/>', '', s)
          s = s.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove"/>\n    <application', 1)
          # Izin media dibuang: plugin open_filex menambahkan READ_MEDIA_* dan
          # Google Play mewajibkan deklarasi khusus untuk izin foto/video.
          # Pilih foto profil/clan memakai Photo Picker (image_picker), tanpa izin.
          for perm in ['READ_MEDIA_IMAGES', 'READ_MEDIA_VIDEO', 'READ_MEDIA_AUDIO',
                       'READ_MEDIA_VISUAL_USER_SELECTED', 'READ_EXTERNAL_STORAGE',
                       'WRITE_EXTERNAL_STORAGE', 'MANAGE_EXTERNAL_STORAGE']:
              s = re.sub(r'\s*<uses-permission android:name="android.permission.%s"[^>]*/>' % perm, '', s)
              s = s.replace('<application', '<uses-permission android:name="android.permission.%s" tools:node="remove"/>\n    <application' % perm, 1)
          if 'supportsPictureInPicture' not in s:
              s = s.replace('<activity', '<activity android:supportsPictureInPicture="true"', 1)
          if 'networkSecurityConfig' not in s:
              s = s.replace('<application', '<application android:networkSecurityConfig="@xml/network_security_config" android:allowBackup="false"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Zenime"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Pasang MainActivity (PiP)
        run: |
          DIR=$(dirname "$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -n1)")
          rm -f "$DIR"/MainActivity.kt "$DIR"/MainActivity.java
          mkdir -p android/app/src/main/kotlin/com/dayynime/wibuplay
          cp android_native/MainActivity.kt android/app/src/main/kotlin/com/dayynime/wibuplay/MainActivity.kt

      - name: Pasang ikon dan splash Zenime
        run: |
          RES=android/app/src/main/res
          rm -f "$RES"/mipmap-*/ic_launcher.png "$RES"/mipmap-*/ic_launcher_round.png
          cp -r android_res/. "$RES/"

      # Push notif (FCM). Nilai Firebase native ditulis ke res/values supaya
      # FirebaseApp default sudah ada di proses Android sebelum Flutter jalan
      # (wajib agar notif tetap diterima saat app ditutup), plus izin
      # POST_NOTIFICATIONS (Android 13+), ikon kecil, warna, dan channel default.
      - name: Pasang Firebase Messaging (push notif)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape
          api = os.environ.get('FIREBASE_API_KEY', '').strip()
          app = os.environ.get('FIREBASE_APP_ID', '').strip()
          if not api or not app:
              print('::warning::FIREBASE_API_KEY/FIREBASE_APP_ID kosong: push notif saat app ditutup tidak akan jalan')
          else:
              vals = {
                  'google_app_id': app,
                  'google_api_key': api,
                  'gcm_defaultSenderId': '936105562787',
                  'project_id': 'zenime-609d0',
                  'google_storage_bucket': 'zenime-609d0.firebasestorage.app',
              }
              xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              for k, v in vals.items():
                  xml += '    <string name="%s" translatable="false">%s</string>\n' % (k, escape(v))
              xml += '</resources>\n'
              open('android/app/src/main/res/values/zenime_firebase.xml', 'w', encoding='utf-8').write(xml)
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application', 1)
          if 'default_notification_icon' not in s:
              i = s.index('<application')
              j = s.index('>', i) + 1
              meta = ('\n        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_zenime"/>'
                      '\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/zenime_notification"/>'
                      '\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="zenime_social"/>')
              s = s[:j] + meta + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -n "POST_NOTIFICATIONS\|default_notification" android/app/src/main/AndroidManifest.xml
          ls android/app/src/main/res/values/

      - name: Ambil dependency
        run: flutter pub get

      # CMake untuk modul native (jni). Dipasang duluan dengan retry karena
      # download dari server Google kadang rusak ("Archive is not a ZIP archive").
      - name: Pasang CMake 3.22.1 (retry)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            if yes | "$SDKM" --install "cmake;3.22.1" > /tmp/cmake.log 2>&1 && [ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]; then
              echo "CMake 3.22.1 terpasang"; exit 0
            fi
            echo "Gagal pasang CMake (percobaan $i), ulangi..."; tail -5 /tmp/cmake.log
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/.temp"
            sleep 10
          done
          echo "::error::CMake 3.22.1 gagal dipasang 3x"; exit 1

      - name: Build App Bundle (PLAY_BUILD)
        env:
          PLAY_SIG_SHA256: ${{ secrets.PLAY_SIG_SHA256 }}
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
          --build-name=$APP_VERSION_NAME --build-number=$APP_VERSION_CODE
          --dart-define=PLAY_BUILD=true
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=APK_SIG_SHA256=$PLAY_SIG_SHA256

      # Flutter menandatangani AAB dengan debug key kalau gradle belum diatur,
      # dan Play MENOLAK AAB debug. Tanda tangan lama dibuang lalu AAB
      # ditandatangani ulang dengan upload key.
      - name: Tanda tangan AAB dengan upload key
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          mkdir -p dist
          OUT="dist/${APP_NAME}-play-v${APP_VERSION_NAME}.aab"
          cp build/app/outputs/bundle/release/app-release.aab "$OUT"
          zip -d "$OUT" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$UPLOAD_KS" \
            -storepass "$UPLOAD_STORE_PASSWORD" \
            -keypass "$UPLOAD_KEY_PASSWORD" \
            "$OUT" "${UPLOAD_KEY_ALIAS:-upload}"
          jarsigner -verify -certs "$OUT" | tail -5
          if keytool -printcert -jarfile "$OUT" | grep -qi "CN=Android Debug"; then
            echo "::error::AAB masih ditandatangani debug key. Pakai upload keystore yang baru."
            exit 1
          fi
          {
            echo "### Upload key (SHA-1 untuk Firebase, opsional)"
            echo '```'
            keytool -printcert -jarfile "$OUT" | grep -E "SHA1|SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simbol debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-play-symbols-v${{ env.APP_VERSION_NAME }}
          path: build/symbols
          retention-days: 90

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-play-v${{ env.APP_VERSION_NAME }}
          path: dist/*.aab
          retention-days: 30
