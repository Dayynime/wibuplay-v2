name: Build APK (debug + profile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Push baru ke branch yang sama membatalkan build lama yang masih jalan.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: Wibuplay                           # nama artifact
  APP_VERSION_CODE: ${{ github.run_number }}   # versionCode naik otomatis (--build-number)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo ini belum punya folder android/. Kalau belum ada, dibuat saat CI
      # (applicationId jadi com.dayynime.wibuplay). Kalau nanti android/
      # di-commit, langkah ini otomatis dilewati.
      - name: Siapkan folder android (kalau belum ada)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.dayynime --project-name wibuplay
          fi

      - name: Ambil dependency
        run: flutter pub get

      # Profile = padanan build "perf": AOT seperti release tapi ditandatangani debug key,
      # jadi performa asli bisa dites tanpa keystore produksi.
      - name: Build Debug APK
        run: flutter build apk --debug --build-number=$APP_VERSION_CODE

      - name: Build Profile APK
        run: flutter build apk --profile --build-number=$APP_VERSION_CODE

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Profile APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-profile
          path: build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 7

      - name: Ringkasan ukuran APK
        if: always()
        run: |
          {
            echo "### APK hasil build #${{ github.run_number }}"
            echo '```'
            ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "tidak ada APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
