name: wibuplay
description: Zenime - port Flutter dari aplikasi Kotlin/Compose (com.dayynime.wibuplay).
publish_to: "none"
version: 2.4.0+20400

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cached_network_image: ^3.4.1
  scrollable_positioned_list: ^0.3.8
  video_player: ^2.9.0
  shimmer: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8
  screen_brightness: ^2.1.0
  volume_controller: ^3.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_remote_config: ^6.0.0
  google_sign_in: ^6.3.0
  web_socket_channel: ^3.0.1
  android_id: ^0.4.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/ic_zcoin_badge.png
    - assets/images/ic_premium_badge.png
