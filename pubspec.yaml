name: wibuplay
description: Zenime - port Flutter dari aplikasi Kotlin/Compose (com.dayynime.wibuplay).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  cached_network_image: ^3.4.1
  video_player: ^2.9.0
  shimmer: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_remote_config: ^6.0.0
  google_sign_in: ^6.3.0
  web_socket_channel: ^3.0.1
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg
    - assets/images/ic_zcoin_badge.png
